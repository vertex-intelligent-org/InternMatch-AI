[project]
name = "internmatch-ai"
version = "1.0.0"
description = "AI-powered personalized internship matching and application assistant."
authors = [
    { name = "Mohammad & Selen", email = "team@aissclub.org" }
]
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["backend", "worker"]

[tool.ruff.lint.isort]
known-third-party = ["supabase"]
