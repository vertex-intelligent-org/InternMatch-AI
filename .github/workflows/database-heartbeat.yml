name: InternMatch Supabase Heartbeat

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  heartbeat:
    name: Production Database Heartbeat
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    env:
      HEARTBEAT_URL: https://api.internmatch.college/api/v1/health
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Execute production readiness heartbeat
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          http_code="$(
            curl \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 20 \
              -X GET \
              "${HEARTBEAT_URL}?heartbeat=${GITHUB_RUN_ID}" \
              -H "Cache-Control: no-cache, no-store" \
              -H "Accept: application/json" \
              -o "$response_file" \
              -w "%{http_code}"
          )"

          if [ "$http_code" != "200" ]; then
            echo "::error::Production readiness failed with HTTP $http_code."
            exit 1
          fi

          if ! jq -e \
            '.database == "connected" and .redis == "connected" and .worker == "ready"' \
            "$response_file" > /dev/null; then
            echo "::error::Production readiness dependencies are not healthy."
            exit 1
          fi

          echo "Heartbeat succeeded: database=connected, redis=connected, worker=ready."

      - name: Alert after consecutive failures
        if: failure()
        shell: bash
        run: |
          set -euo pipefail

          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          workflow_path="actions/workflows/database-heartbeat.yml/runs?event=schedule&per_page=5"

          previous_conclusion="$(
            curl \
              --silent \
              --show-error \
              --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$api_base/$workflow_path" |
              jq -r \
                --arg current "$GITHUB_RUN_ID" \
                '[.workflow_runs[]
                  | select((.id|tostring) != $current)
                  | .conclusion][0] // "none"'
          )"

          if [ "$previous_conclusion" != "failure" ]; then
            echo "::warning::First heartbeat failure detected."
            exit 0
          fi

          echo "::warning::Two consecutive heartbeat failures detected."

          issue_number="$(
            curl \
              --silent \
              --show-error \
              --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$api_base/issues?state=open&per_page=100" |
              jq -r \
                '.[] | select(.title == "Supabase Heartbeat Failure") | .number' |
              head -n 1
          )"

          body="Supabase heartbeat has failed on two or more consecutive scheduled runs.

          Latest run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The workflow will close this alert automatically after a successful recovery."

          if [ -z "$issue_number" ]; then
            jq -n \
              --arg title "Supabase Heartbeat Failure" \
              --arg body "$body" \
              '{title:$title,body:$body}' |
              curl \
                --silent \
                --show-error \
                --fail \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: application/json" \
                "$api_base/issues" \
                --data-binary @-

            echo "Created Supabase Heartbeat Failure issue."
          else
            jq -n \
              --arg body "$body" \
              '{body:$body}' |
              curl \
                --silent \
                --show-error \
                --fail \
                -X PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: application/json" \
                "$api_base/issues/$issue_number" \
                --data-binary @-

            echo "Updated existing Supabase Heartbeat Failure issue."
          fi

      - name: Close alert after recovery
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          api_base="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          issue_number="$(
            curl \
              --silent \
              --show-error \
              --fail \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$api_base/issues?state=open&per_page=100" |
              jq -r \
                '.[] | select(.title == "Supabase Heartbeat Failure") | .number' |
              head -n 1
          )"

          if [ -n "$issue_number" ]; then
            jq -n \
              '{state:"closed"}' |
              curl \
                --silent \
                --show-error \
                --fail \
                -X PATCH \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2026-03-10" \
                -H "Content-Type: application/json" \
                "$api_base/issues/$issue_number" \
                --data-binary @-

            echo "Closed recovered Supabase Heartbeat Failure issue."
          fi
